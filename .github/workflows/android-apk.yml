name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.0', channel: stable, cache: true }

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test || true

      - name: Decode release keystore
        run: |
          echo "${{ secrets.PAMOJI_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.p12
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.PAMOJI_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.PAMOJI_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.PAMOJI_KEY_ALIAS }}
          storeFile=release.p12
          PROPS

      - name: Build signed release APK
        run: |
          flutter build apk --release
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -4

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest --title "PAMOJI latest" --notes "Signed release build from main." --prerelease || true
          gh release upload latest build/app/outputs/flutter-apk/app-release.apk --clobber
